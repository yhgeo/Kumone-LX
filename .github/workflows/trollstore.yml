name: Build TrollStore IPA

on:
  push:
    branches: [main]
    # 只有代码/工程改动才构建；文档、日志说明等改动不触发。
    paths:
      - "Sources/**"
      - "ios/**"
      - "Package.swift"
      - "Package.resolved"
  workflow_dispatch:

# 同一分支反复提交时，取消仍在排队的旧构建，避免堆积多次。
concurrency:
  group: trollstore-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

# 完全沿用 kumone 原版 release.yml 的 iOS 构建方式：
# xcodebuild（CODE_SIGNING_ALLOWED=NO）→ cp 到 Payload → zip。
# 产出的是 unsigned IPA，TrollStore 就是用来装 unsigned IPA 的
# （签名由 TrollStore 在设备上通过 CoreTrust 完成，构建端不需要 ldid/codesign）。
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          xcodebuild -version
          echo "SDK $(xcrun --show-sdk-version)"

      - name: Derive version
        run: |
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Resolve SPM packages
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -workspace ios/KumoneIOS.xcworkspace -scheme KumoneIOS 2>&1 | tail -20

      - name: Build unsigned iOS IPA
        run: |
          mkdir -p dist
          # 关键：不用 `| tail` 吞掉 xcodebuild 的退出码。直接输出到日志，
          # 编译失败时 bash -e 会立即中止，绝不会打出空 IPA。
          xcodebuild -workspace ios/KumoneIOS.xcworkspace -scheme KumoneIOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build
          APP="$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/KumoneIOS.app"
          # 校验：app 目录必须存在且包含 Mach-O 可执行文件
          test -d "$APP" || { echo "app not found"; exit 1; }
          BIN=$(find "$APP" -maxdepth 1 -type f -perm -u+x | head -1)
          test -n "$BIN" || { echo "no executable in app"; exit 1; }
          echo "executable: $BIN ($(stat -f%z "$BIN") bytes)"
          mkdir -p "$RUNNER_TEMP/payload/Payload"
          cp -R "$APP" "$RUNNER_TEMP/payload/Payload/"
          (cd "$RUNNER_TEMP/payload" && zip -qry "$GITHUB_WORKSPACE/dist/Kumone-LX.ipa" Payload)
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kumone-LX-trollstore-ipa
          path: dist/Kumone-LX.ipa
          if-no-files-found: error

      - name: Publish to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Kumone-LX ${GITHUB_REF_NAME}" \
            --notes "TrollStore 免签名 IPA。基于 kumone，集成 LX 自定义音源 + 每日推荐历史存档。" \
            dist/Kumone-LX.ipa || \
          gh release upload "${GITHUB_REF_NAME}" dist/Kumone-LX.ipa --clobber
